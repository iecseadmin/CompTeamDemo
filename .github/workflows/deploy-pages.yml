name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'tsconfig*.json'
      - '.oxlintrc.json'
      - '.stylelintrc.json'
      - '.htmlhintrc'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Lint source
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run lint

      - name: Lint CSS
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run lint:css

      - name: Lint HTML
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run lint:html

      - name: Validate data schemas
        shell: pwsh
        run: npm run validate:data
        
      - name: Check deprecated dependencies
        shell: pwsh
        run: npm run check:deprecated
        
      - name: Security audit
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Fetch updated ratings
        shell: pwsh
        run: npm run fetch:ratings

      - name: Commit updated ratings
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- src/data/ratings.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Ratings are unchanged.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw 'Could not inspect ratings changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh platform ratings [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit ratings.' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push ratings.' }
        
      - name: Build static site
        shell: pwsh
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
